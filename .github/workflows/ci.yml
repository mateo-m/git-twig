name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: macos-latest
            filesystem: apfs
          - os: ubuntu-latest
            filesystem: xfs
          - os: ubuntu-latest
            filesystem: btrfs
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: git --version
      - run: cargo fmt --all --check
      - run: cargo run -p twig-bench --bin twig-readme-table --locked -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Prepare reflink-capable Linux test filesystem
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs btrfs-progs
          image="$RUNNER_TEMP/twig-${{ matrix.filesystem }}.img"
          truncate -s 1G "$image"
          if [ "${{ matrix.filesystem }}" = xfs ]; then
            mkfs.xfs -m reflink=1 "$image"
          else
            mkfs.btrfs "$image"
          fi
          mkdir -p target/test-fixtures
          sudo mount -o loop "$image" target/test-fixtures
          sudo chown "$(id -u):$(id -g)" target/test-fixtures
      - name: Require native Linux reflinks
        if: runner.os == 'Linux'
        env:
          TWIG_TEST_REQUIRE_NATIVE: '1'
        run: cargo test -p git-twig --locked
      - run: cargo build --workspace --release --locked
  minimum-git:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: git/git
          ref: v2.40.0
          path: .git-minimum
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Build minimum supported Git
        run: |
          # Git 2.40 predates C23: GCC 15 otherwise clashes with its unreachable() helper.
          make -C .git-minimum -j4 CFLAGS="-O2 -std=gnu99" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease \
            NO_CURL=YesPlease NO_EXPAT=YesPlease NO_OPENSSL=YesPlease \
            prefix="$RUNNER_TEMP/git-minimum" install
          echo "$RUNNER_TEMP/git-minimum/bin" >> "$GITHUB_PATH"
      - run: git --version
      - run: cargo test --workspace --locked
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo check --workspace --locked
